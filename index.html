<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Management App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Contact Manager</a>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between mb-3">
      <input id="searchInput" class="form-control w-50 me-3" placeholder="Search contacts..." aria-label="Search contacts">
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#contactModal" id="addContactBtn">+ Add Contact</button>
    </div>

    <div id="alertPlaceholder"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsList"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="contactForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="contactId">

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input required class="form-control" id="name" placeholder="Full name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" required class="form-control" id="email" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input class="form-control" id="phone" placeholder="Optional phone">
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="notes" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
