<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Management App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Contact Manager</a>
    </div>
  </nav>

  <div class="container">
    <div class="mb-3">
      <div class="row mb-3">
        <div class="col-md-6">
          <input id="searchInput" class="form-control" placeholder="Search contacts..." aria-label="Search contacts">
        </div>
        <div class="col-md-3">
          <select id="groupFilter" class="form-select">
            <option value="">All Groups</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#contactModal" id="addContactBtn">+ Add Contact</button>
        </div>
      </div>
    </div>

    <div id="alertPlaceholder"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Group</th>
            <th>Tags</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsList"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="contactForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="contactId">

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input required class="form-control" id="name" placeholder="Full name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" required class="form-control" id="email" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input class="form-control" id="phone" placeholder="Optional phone">
          </div>

          <div class="mb-3">
            <label class="form-label">Group</label>
            <div class="input-group mb-2">
              <select class="form-select" id="group">
                <option value="">-- Select Group --</option>
              </select>
              <button type="button" class="btn btn-outline-secondary" id="newGroupBtn" data-bs-toggle="modal" data-bs-target="#groupModal">+ New</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Tags</label>
            <div class="input-group mb-2">
              <input type="text" class="form-control" id="tagInput" placeholder="Add tags (comma separated)">
              <button type="button" class="btn btn-outline-secondary" id="addTagBtn">Add Tag</button>
            </div>
            <div id="tagsList" class="mt-2"></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="notes" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Group Modal -->
  <div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create New Group</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text" class="form-control" id="groupName" placeholder="Enter group name">
          </div>
          <div class="mb-3">
            <label class="form-label">Group Description</label>
            <textarea class="form-control" id="groupDescription" rows="2" placeholder="Optional description"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveGroupBtn">Create Group</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
