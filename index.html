<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Management App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Contact Manager</a>
      <div class="d-flex">
        <div class="dropdown">
          <button class="btn btn-light dropdown-toggle" type="button" id="backupMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
              <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
              <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
            </svg>
            Backup & Import
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="backupMenuBtn">
            <li><h6 class="dropdown-header">Export</h6></li>
            <li><button class="dropdown-item" id="exportJsonBtn">📥 Export to JSON</button></li>
            <li><button class="dropdown-item" id="exportCsvBtn">📊 Export to CSV</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header">Import</h6></li>
            <li>
              <label class="dropdown-item" style="cursor: pointer;">
                📤 Import from JSON
                <input type="file" id="importFileInput" accept=".json" style="display: none;">
              </label>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header">Backup</h6></li>
            <li><button class="dropdown-item" id="backupBtn">💾 Create Backup</button></li>
            <li>
              <label class="dropdown-item" style="cursor: pointer;">
                🔄 Restore Backup
                <input type="file" id="restoreFileInput" accept=".json" style="display: none;">
              </label>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" id="clearDataBtn">🗑️ Clear All Data</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between mb-3">
      <input id="searchInput" class="form-control w-50 me-3" placeholder="Search contacts..." aria-label="Search contacts">
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#contactModal" id="addContactBtn">+ Add Contact</button>
    </div>

    <div id="alertPlaceholder"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsList"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="contactForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="contactId">

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input required class="form-control" id="name" placeholder="Full name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" required class="form-control" id="email" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input class="form-control" id="phone" placeholder="Optional phone">
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="notes" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script src="backup.js"></script>
</body>
</html>
